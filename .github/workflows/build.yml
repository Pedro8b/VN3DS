name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install portlibs
        run: dkp-pacman -Sy --noconfirm --needed 3ds-libvorbisidec 3ds-libogg 3ds-zlib 3ds-liblua51

      - name: Install makerom and bannertool
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip curl ca-certificates
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o makerom.zip  # v0.18.4: the newer builds need glibc 2.38, newer than the devkitPro image
          curl -fsSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o bannertool.zip
          install -m755 "$(find . -type f -name makerom | head -1)" /usr/local/bin/makerom
          install -m755 "$(find . -type f -path '*linux-x86_64*' -name bannertool | head -1)" /usr/local/bin/bannertool

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Build .cia
        run: bash cia/build_cia.sh

      - uses: actions/upload-artifact@v5
        with:
          name: VN3DS
          path: |
            VN3DS.3dsx
            VN3DS.cia

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VN3DS ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            VN3DS.3dsx
            VN3DS.cia
